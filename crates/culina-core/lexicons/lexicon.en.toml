[units.C]
dim = "temperature"

[units.clove]
dim = "count"
long = "clove"

[units.stalk]
dim = "count"
long = "stalk"

[units.can]
dim = "count"
long = "can"

[units.bunch]
dim = "count"
long = "bunch"

[units.handful]
dim = "count"
long = "handful"

[units.batch]
dim = "count"
long = "batch"

[units.slice]
dim = "count"
long = "slice"
